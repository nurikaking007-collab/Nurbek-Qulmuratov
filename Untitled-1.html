<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening sahifam</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .profile {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            color: #667eea;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            opacity: 0.85;
            margin-bottom: 25px;
        }

        .about {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .buttons a {
            text-decoration: none;
            color: #333;
            background: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
        }

        .buttons a:hover {
            transform: translateY(-3px);
            background: #f1f1f1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        footer {
            margin-top: 25px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">👤</div>

        <h1>Mening sahifam</h1>

        <p class="subtitle">Xush kelibsiz! 👋</p>

        <p class="about">
            Salom! Men haqimdagi ma'lumotlar shu sahifada.
            Bu yerga o'zingiz haqingizda qisqacha ma'lumot yozishingiz mumkin.
        </p>

        <div class="buttons">
            <a href="https://t.me/kulmuratovo9"target="_blank">📱 Telegram</a>
            <a href="https://instagram.com/kulmuratov.09" target="_blank">📸 Instagram</a>
            <a href="https://github.com/" target="_blank">💻 GitHub</a>
        </div>

        <footer>
            © 2026 Mening sahifam
        </footer>

    </div>

</body>
</html>
